# Mixing projects: the das-02 nginx gateway stays the single origin and sends the
# heavy paths to das-edge (Go) instead of the Node spectrum/telemetry services.
# Include inside the gateway's `server { }` block, before the generic /api/ location.
# das-edge runs with: -listen unix:/run/das/edge.sock -legacy unix:/run/das/core-api.sock

upstream das_edge {
    server unix:/run/das/edge.sock;
    keepalive 16;
}

location /api/spectrum {
    proxy_pass http://das_edge;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering on;          # nginx absorbs slow clients; the edge moves on
    proxy_read_timeout 30s;      # long-poll (waitMs) stays below this
}

location = /api/volatile-data {
    proxy_pass http://das_edge;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
}

location /api/ws/ {
    proxy_pass http://das_edge;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;   # the edge compares Origin with Host (CSWSH check)
    proxy_read_timeout 1h;
}
