# Drop-in for the EXISTING backend unit (rename the directory to match your unit,
# e.g. /etc/systemd/system/<your-unit>.service.d/10-hotfix.conf), then:
#   systemctl daemon-reload && systemctl restart <your-unit>
#
# Rollback without redeploying code: set DAS_MODE=legacy (or delete this file).
[Service]
Environment=DAS_MODE=hotfix
# One worker on single/dual-core SoCs, two on quad-core. 0 = auto.
Environment=DAS_WORKERS=0
# Worker threads run at nice 10 (Linux applies nice per thread); the event loop keeps priority.
Environment=DAS_WORKER_NICE=10
Environment=DAS_WORKER_HEAP_MB=96
Environment=DAS_WORKER_YOUNG_MB=8
Environment=DAS_GZIP_LEVEL=1
Environment=DAS_SPECTRUM_IDLE_MS=15000
# Optional throttle for very small CPUs: at most one sweep per session every N ms.
Environment=DAS_SPECTRUM_MIN_INTERVAL_MS=0
Environment=DAS_BLOCK_WARN_MS=200
# libuv pool (async gzip, fs): 2 threads is plenty on an embedded box.
Environment=UV_THREADPOOL_SIZE=2
# glibc: fewer malloc arenas = less RSS growth with worker threads (measured ~25 MB less)
Environment=MALLOC_ARENA_MAX=2
# Keep V8 from growing until the kernel OOM-kills the process.
Environment=NODE_OPTIONS=--max-old-space-size=256
Restart=on-failure
RestartSec=2
