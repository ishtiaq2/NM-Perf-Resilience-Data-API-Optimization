[package]
name = "das-engtools"
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
description = "DAS Master Unit data plane in Rust: Spectrum Analyzer and Distance-to-Fault engineering tools"
publish = false

[lib]
name = "das_engtools"
path = "src/lib.rs"

[[bin]]
name = "das-engtools"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
rustfft = "6"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
libc = "0.2"
itoa = "1"

[dev-dependencies]
tokio-tungstenite = "0.29"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
