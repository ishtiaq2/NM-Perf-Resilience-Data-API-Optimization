# das-engtools inside the das-02 gateway (the "multi-service API gateway" path).
#
# das-engtools takes over the spectrum-service socket, so the existing
# `upstream spectrum { server unix:/run/das/spectrum.sock; }` and the
# /api/spectrum, /api/ws/spectrum locations stay exactly as they are. Add these
# two locations to /etc/das/nginx/das-locations.conf (anywhere: nginx picks the
# exact match and the longest prefix, not the first one).
#
# das-engtools runs with:
#   --listen unix:/run/das/spectrum.sock --sidecar --legacy unix:/run/das/core-api.sock

# Capabilities of the whole origin: core-api's features (config locking, telemetry
# delta and WebSocket) plus the engineering tools. das-engtools asks core-api itself
# (cached 5 s), so a frontend discovers distance-to-fault without a core-api change.
location = /api/capabilities {
    proxy_pass http://spectrum;
    proxy_read_timeout 5s;
    error_page 502 503 504 = @capabilities_core_api;   # das-engtools down: core-api's answer
}
location @capabilities_core_api {
    proxy_pass http://core_api;
}

# Distance-to-fault. One measurement per (node, port, settings), shared by every
# client; ?waitMs= long-polls for the next one, so allow for that.
location /api/dtf {
    proxy_pass http://spectrum;
    limit_req zone=spectrum_per_ip burst=20 nodelay;
    proxy_read_timeout 15s;
    proxy_buffering on;
}
