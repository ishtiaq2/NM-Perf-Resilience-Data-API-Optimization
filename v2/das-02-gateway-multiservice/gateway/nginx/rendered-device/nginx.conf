# DAS Master Node gateway: the ONE web server the browser talks to.
#
# nginx is event-driven C: one worker uses a few MB of RAM and handles
# thousands of connections without a garbage collector or a JS event loop.
# It serves the Angular app, terminates TLS/HTTP/2, and routes /api/* by path
# to isolated backend processes over Unix sockets.
#
# Rendered by scripts/render-nginx.js (profiles: device, local) from placeholders in double at-signs.
# Validate: nginx -t -p /etc/das/nginx -c /etc/das/nginx/nginx.conf

worker_processes 1;                  # one event loop is plenty on an embedded SoC
pid /run/das/nginx.pid;
error_log /var/log/das/error.log warn;
user dasgw das;   # worker user must be in group "das" to reach the 0660 service sockets

events {
    worker_connections 1024;
}

http {
    include       /etc/das/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    charset       utf-8;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65s;
    client_max_body_size 256k;       # config writes are small; refuse anything else early

    # Temp files under the runtime dir (tmpfs on the device: no flash wear).
    client_body_temp_path /run/das/nginx-tmp/body;
    proxy_temp_path       /run/das/nginx-tmp/proxy;
    fastcgi_temp_path     /run/das/nginx-tmp/fastcgi;
    uwsgi_temp_path       /run/das/nginx-tmp/uwsgi;
    scgi_temp_path        /run/das/nginx-tmp/scgi;

    # Buffered access log: one flash write per 32 kB / 10 s instead of one per request.
    log_format das '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                   'rt=$request_time urt=$upstream_response_time cache=$upstream_cache_status';
    access_log /var/log/das/access.log das buffer=32k flush=10s;

    # Dynamic gzip for JSON; the API services already gzip their big payloads once.
    gzip              on;
    gzip_comp_level   1;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        application/json application/javascript text/css image/svg+xml text/plain;

    # ---- backend services (one process each, own event loop, own cgroup) ----
    upstream core_api  { server unix:/run/das/core-api.sock;      keepalive 8; }
    upstream spectrum  { server unix:/run/das/spectrum.sock;  keepalive 8; }
    upstream telemetry { server unix:/run/das/telemetry.sock; keepalive 8; }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Micro-cache: N dashboards polling volatile-data cost the telemetry service
    # at most ONE request per second (proxy_cache_lock collapses the misses).
    proxy_cache_path /run/das/nginx-cache levels=1 keys_zone=microcache:1m max_size=16m inactive=10s use_temp_path=off;

    # Protect the RF hardware from runaway clients: sweeps per client IP.
    limit_req_zone $binary_remote_addr zone=spectrum_per_ip:1m rate=20r/s;
    limit_req_status 429;

    server {
        listen 80;
        # To force HTTPS (recommended): replace the include below with  return 301 https://$host$request_uri;
        include /etc/das/nginx/das-locations.conf;
    }
    # HTTPS + HTTP/2: one multiplexed connection per browser instead of 6,
    # so a heartbeat never queues behind spectrum downloads in the browser.
    server {
        listen 443 ssl http2;   # nginx >= 1.25.1 prefers: listen 443 ssl; http2 on;
        ssl_certificate     /etc/das/tls/device.crt;
        ssl_certificate_key /etc/das/tls/device.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 1h;
        include /etc/das/nginx/das-locations.conf;
    }
}
