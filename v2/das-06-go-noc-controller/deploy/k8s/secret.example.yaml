# The token signing secret. Do not commit a real one: create it with
#   kubectl -n das-noc create secret generic das-noc-secret \
#     --from-literal=current="$(head -c 32 /dev/urandom | base64)"
# Rotation: add the new value as "current" and move the old one to "previous";
# both are accepted until every device has a token signed with the new one
# (docs/OPERATIONS.md). The NOC reads the secret at start: restart after a change.
apiVersion: v1
kind: Secret
metadata:
  name: das-noc-secret
  namespace: das-noc
type: Opaque
stringData:
  current: "REPLACE-ME-with-32-random-bytes-base64"
  # previous: "the secret being rotated out"
